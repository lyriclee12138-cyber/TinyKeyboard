; ESP32-S3 网页 HID 键盘
; 用 VS Code + PlatformIO 打开本目录即可编译/上传；
; 也可以用 Arduino IDE 直接打开 firmware/esp32_key_send/esp32_key_send.ino。
;
; 上传走左侧 COM 口（CH343），右侧 USB 口留给目标电脑做 HID。

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
src_dir   = firmware/esp32_key_send

monitor_speed = 115200
upload_speed  = 921600

board_build.flash_size      = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions      = default.csv

; USB 口做原生 HID；Serial 保留在 UART0(COM 口)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
